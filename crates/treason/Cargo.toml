[package]
name = "treason"
description = "A MIDI sequencer driven by an AI agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
treason-control.workspace = true
treason-core.workspace = true
treason-devices.workspace = true
treason-engine.workspace = true
treason-io = { workspace = true, features = ["smf"] }
treason-mcp.workspace = true

# The ALSA sequencer queue backend, which `engine.backend = "alsa-seq"` picks.
[target.'cfg(target_os = "linux")'.dependencies]
treason-io = { workspace = true, features = ["alsa-seq"] }

[dev-dependencies]
midly.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }

[lints]
workspace = true
