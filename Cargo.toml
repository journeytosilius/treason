[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# Our crates.
treason-control = { path = "crates/treason-control" }
treason-core = { path = "crates/treason-core" }
treason-devices = { path = "crates/treason-devices" }
treason-engine = { path = "crates/treason-engine" }
treason-io = { path = "crates/treason-io" }
treason-mcp = { path = "crates/treason-mcp" }

# Third-party crates. All support Rust 1.95; see ARCHITECTURE.md, "Dependencies".
alsa = "0.12.1"
anyhow = "1.0.104"
arc-swap = "1.9.2"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
midir = "0.11.1"
# Without its default "parallel" feature, which brings in rayon.
midly = { version = "0.5.3", default-features = false, features = ["std"] }
rmcp = { version = "3.5.1", features = ["transport-io", "transport-streamable-http-server"] }
rtrb = "0.4.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
spin_sleep = "1.3.3"
thiserror = "2.0.21"
thread-priority = "3.1.1"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7.20"
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
